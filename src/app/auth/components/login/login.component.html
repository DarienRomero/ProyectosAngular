<div class="container">
    <div class="row justify-content-center vh-100 align-items-center">
      <div class="col-md-6">
        <h2 class="text-center">Iniciar sesión</h2>
        <form (ngSubmit)="onLogin()">
          <div class="form-group mb-3">
            <label for="email">Correo</label>
            <input type="email" id="email" class="form-control" [(ngModel)]="email" name="email" required email="true">
          </div>
          <div class="form-group mb-5">
            <label for="password">Contraseña</label>
            <input type="password" id="password" class="form-control" [(ngModel)]="password" name="password" required>
          </div>
          <div
            class="w-100 d-flex flex-row justify-content-center"
          >
            <button type="submit" [disabled]="loadingLogin" class="btn btn-primary w-100">Iniciar sesión</button>
          </div>
        </form>
      </div>
    </div>
  </div>
